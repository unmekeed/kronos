# Kronos trading system configuration.
# Secrets (API keys, telegram token) live in .env, not here.

mode: paper            # paper | live

exchange:
  id: binance          # any ccxt exchange id
  market_type: spot    # spot | future
  symbol: BTC/USDT
  timeframe: 5m
  taker_fee: 0.001     # 0.1% spot taker
  slippage: 0.0005     # 5 bps assumed slippage in paper mode

model:
  # Kronos-mini + its 2k tokenizer (https://github.com/shiyu-coder/Kronos)
  model_name: NeoQuasar/Kronos-mini
  tokenizer_name: NeoQuasar/Kronos-Tokenizer-2k
  device: cuda:0       # cuda:0 | cpu
  max_context: 512     # candles fed into the model
  pred_len: 12         # candles predicted forward
  n_samples: 3         # independent samples for confidence estimation
  temperature: 1.0
  top_p: 0.9
  use_mock: false      # true = momentum mock instead of Kronos (no GPU needed)

strategy:
  min_expected_return: 0.0015   # 0.15% predicted move required to act
  min_confidence: 0.55          # below this the signal is HOLD
  close_on_opposite: true       # close position when signal flips

risk:
  risk_per_trade: 0.01          # 1% of balance risked per trade
  max_position_pct: 0.25        # position notional <= 25% of balance
  max_open_positions: 1
  stop_loss_pct: 0.01           # 1%
  take_profit_pct: 0.02         # 2%
  max_daily_loss_pct: 0.05      # stop trading for the day after -5%
  max_drawdown_pct: 0.15        # kill switch
  cooldown_after_loss_sec: 300
  min_order_usd: 10             # exchange min notional
  allow_short: false            # spot by default; enable on futures

trading:
  cycle_interval_sec: 60        # how often the trade cycle runs
  max_cycle_time_sec: 15        # performance requirement: full cycle < 15s
  paper_start_balance: 50       # USD, matches the 10-50$ live deposit stage

telegram:
  enabled: true
  poll_timeout_sec: 25
  daily_report_hour_utc: 20

monitoring:
  interval_sec: 30
  max_ram_pct: 90
  max_gpu_mem_pct: 90
  connection_check_interval_sec: 60

logging:
  dir: logs
  level: INFO
  max_bytes: 10485760           # 10 MB per file
  backup_count: 5
